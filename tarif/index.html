<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tarif Kartı · Dijital Çakı</title>
<meta name="description" content="Malzemeleri işaretle, porsiyonları değiştir ve tarifini sakla.">
<link rel="icon" href="/icons/dijital-caki.svg">
<link rel="stylesheet" href="/tool.css?v=20261126d">
<link rel="stylesheet" href="/gunluk/style.css?v=1">
<script src="/theme.js?v=20261126c"></script>
<script type="module" src="app.js?v=1"></script>
</head>
<body>
<main class="tool daily">
<header>
  <a class="back" href="/#ev">Uygulamalar</a>
  <h1>Tarif Kartı</h1>
  <p class="intro">Malzemeleri işaretle, porsiyonları değiştir ve tarifini sakla.</p>
</header>
<section class="panel">
  <label for="recipes">Kayıtlı tarifler</label><select id="recipes"><option value="">Yeni tarif</option></select>
</section>
<form id="recipe" class="panel">
  <div class="fields">
    <label class="wide">Tarif adı<input id="title" maxlength="100" required></label>
    <label>Tarifteki porsiyon<input id="base" inputmode="numeric" type="number" min="1" max="1000" value="4" required></label>
    <label>Yapacağın porsiyon<input id="servings" inputmode="numeric" type="number" min="1" max="1000" value="4" required></label>
    <label class="wide">Malzemeler<textarea id="ingredients" rows="5" maxlength="12000" placeholder="200 g un&#10;1,5 su bardağı süt&#10;1/2 çay kaşığı tuz" required></textarea></label>
    <label class="wide">Hazırlanışı<textarea id="steps" rows="3" maxlength="18000"></textarea></label>
    <label class="wide">Kaynak bağlantısı (isteğe bağlı)<input id="source" type="url" maxlength="2000" placeholder="https://"></label>
  </div>
  <div class="row"><button type="submit" class="primary">Tarifi kaydet</button><button type="button" id="remove" hidden>Tarifi sil</button></div>
  <p id="status" role="status"></p>
</form>
<section class="panel">
  <h2 id="card-title">Tarif kartı</h2>
  <div id="ingredient-view"></div>
  <p id="steps-view"></p>
  <a id="source-view" hidden target="_blank" rel="noopener noreferrer">Tarif kaynağı</a>
</section>
</main>
</body>
</html>
